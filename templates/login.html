{% extends 'base.html' %}
{% block title %}로그인 - Daily Work{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-title">
    <div>Daily Work</div>
    <div class="muted">3팀 · 5팀 일일업무 / 신호처리 / 분석현황</div>
  </div>

  <form method="post" class="card">
    <h2>로그인</h2>
    <label class="field">순번 (ID)
      <input class="inp" type="text" name="seq" inputmode="numeric" autofocus required>
    </label>
    <label class="field">비밀번호
      <input class="inp" type="password" name="password" required>
    </label>
    <button class="btn" type="submit">로그인</button>
  </form>

  <div style="text-align:center">
    <span class="muted">계정이 없으신가요?</span>
    <a class="btn2" href="{{ url_for('register') }}" style="margin-left:8px">계정 만들기</a>
  </div>
</div>
{% endblock %}
